name: Deploy WebUI

# 只发布 webui/ 目录（纯前端，无后端）。
# 仓库设置里把 Pages 的 Source 改成 "GitHub Actions" 后，每次推 main 自动上线：
#   https://<user>.github.io/<repo>/

on:
  push:
    branches: [main]
    paths:
      - "webui/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: webui

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
